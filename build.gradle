plugins { id 'fabric-loom' version '1.14.10' }
base { archivesName = 'volt' }
def voltMinecraft = providers.gradleProperty('voltMinecraft').getOrElse('1.21.11')
def voltFabricApi = providers.gradleProperty('voltFabricApi').getOrElse('0.141.6+1.21.11')
if (voltMinecraft != '1.21.11') {
    sourceSets.main.java.setSrcDirs([layout.buildDirectory.dir("ports/${voltMinecraft}/java")])
    base.archivesName = "volt-mc${voltMinecraft}"
}
repositories { mavenCentral() }
dependencies {
    minecraft "com.mojang:minecraft:${voltMinecraft}"
    mappings loom.officialMojangMappings()
    modImplementation 'net.fabricmc:fabric-loader:0.19.5'
    modImplementation "net.fabricmc.fabric-api:fabric-api:${voltFabricApi}"
    testImplementation platform('org.junit:junit-bom:5.11.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}
processResources {
    inputs.property 'version', project.version
    inputs.property 'minecraftVersion', voltMinecraft
    inputs.property 'discordApplicationId', providers.gradleProperty('voltDiscordApplicationId').getOrElse('')
    filesMatching('volt-discord.properties') { expand discordApplicationId: providers.gradleProperty('voltDiscordApplicationId').getOrElse('') }
    filesMatching('fabric.mod.json') { expand version: project.version, minecraftVersion: voltMinecraft }
}
java { toolchain.languageVersion = JavaLanguageVersion.of(21); withSourcesJar() }
tasks.withType(JavaCompile).configureEach { options.release = 21; options.encoding = 'UTF-8' }
test { useJUnitPlatform() }

sourceSets {
    smoke {
        if (voltMinecraft != '1.21.11') java.setSrcDirs([layout.buildDirectory.dir("ports/${voltMinecraft}/smoke")])
        compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
        runtimeClasspath += output + compileClasspath + sourceSets.main.runtimeClasspath
    }
}
loom {
    mods {
        volt { sourceSet sourceSets.main }
        voltsmoke { sourceSet sourceSets.smoke }
    }
    runs {
        smoke {
            client()
            vmArgs '-Xms256m', (project.hasProperty('voltCompatTest') ? '-Xmx4G' : '-Xmx1536m')
            source sourceSets.smoke
            runDir voltMinecraft == '1.21.11' ? 'run/smoke' : "run/ports/${voltMinecraft}"
            programArgs '--username', 'VoltTester', '--width', '1280', '--height', '800'
            if (project.hasProperty('voltFullscreen')) vmArgs '-Dvolt.fullscreen=true'
            if (project.hasProperty('voltSecondaryDisplay')) vmArgs '-Dvolt.secondaryDisplay=true'
            if (project.hasProperty('voltAutoTest')) vmArgs '-Dvolt.autoTest=true'
            if (project.hasProperty('voltUiOnly')) vmArgs '-Dvolt.uiOnly=true'
            if (project.hasProperty('voltUiScale')) vmArgs "-Dvolt.uiScale=${project.property('voltUiScale')}"
        }
    }
}

// Production-namespace harness for testing unmodified third-party mod jars.
tasks.register('smokeJar', Jar) {
    dependsOn tasks.named('smokeClasses')
    from sourceSets.smoke.output
    archiveClassifier = 'smoke-dev'
}
tasks.register('remapSmokeJar', net.fabricmc.loom.task.RemapJarTask) {
    dependsOn tasks.named('smokeJar')
    inputFile = tasks.named('smokeJar').flatMap { it.archiveFile }
    archiveClassifier = 'smoke'
    classpath.from sourceSets.smoke.compileClasspath
}
