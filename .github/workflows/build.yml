name: Build and verify Volt
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  fabric:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Install media tools
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Test and build Minecraft 1.21.11 Fabric
        run: ./gradlew build --console=plain
      - name: Verify optional sharing server
        run: python3 -m unittest discover -s share-server -v
      - uses: actions/upload-artifact@v4
        with:
          name: volt-mc1.21.11-fabric
          path: |
            build/libs/volt-*.jar
            !build/libs/*-smoke*.jar
          if-no-files-found: error
